<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoghanCare - Section 7.5 (Measurable Impact)</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        /* ===== CSS VARIABLES & RESET ===== */
        :root {
            --primary: #3B82F6;
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --border: #e2e8f0;
            --icon-bg: #eff6ff; /* Light blue for icon circles */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ========================================================
           SECTION 7.5: MEASURABLE IMPACT
           ======================================================== */
        .section-impact {
            padding: 100px 0;
            background-color: #ffffff;
        }

        .impact-header {
            text-align: center;
            margin-bottom: 70px;
        }

        .impact-header h2 {
            font-size: 48px;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.2;
            letter-spacing: -1px;
        }

        /* Stats Grid Layout */
        .impact-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
            align-items: center;
        }

        /* Individual Stat Item */
        .stat-item {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative; /* For the vertical divider */
        }

        /* Vertical Divider (using pseudo-element) */
        .stat-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: -20px; /* Positions exactly in the middle of the 40px gap */
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 70%;
            background-color: var(--border);
        }

        /* Icon Circle */
        .stat-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--icon-bg);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .stat-icon svg {
            width: 32px;
            height: 32px;
            stroke-width: 2;
        }

        /* Content formatting */
        .stat-content {
            display: flex;
            flex-direction: column;
        }

        .stat-content h3 {
            font-size: 46px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .stat-content strong {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .stat-content p {
            font-size: 12px;
            color: var(--text-gray);
            line-height: 1.4;
        }

        /* ========================================================
           RESPONSIVE DESIGN
           ======================================================== */
        @media (max-width: 1200px) {
            .stat-content h3 { font-size: 38px; }
            .stat-icon { width: 65px; height: 65px; }
            .stat-icon svg { width: 28px; height: 28px; }
        }

        @media (max-width: 992px) {
            .impact-header h2 { font-size: 40px; }
            
            /* Switch to 2x2 Grid for Tablets */
            .impact-grid {
                grid-template-columns: repeat(2, 1fr);
                row-gap: 50px;
            }

            /* Adjust dividers for 2x2 layout */
            .stat-item::after { display: none; } /* Hide all original dividers */
            
            /* Only show divider on the 1st and 3rd items */
            .stat-item:nth-child(1)::after,
            .stat-item:nth-child(3)::after {
                display: block;
            }
        }

        @media (max-width: 768px) {
            .impact-header h2 { font-size: 36px; }
            
            /* Switch to 1 Column for Mobile */
            .impact-grid {
                grid-template-columns: 1fr;
                row-gap: 40px;
            }

            /* Remove all vertical dividers */
            .stat-item::after { display: none !important; }
            
            .stat-item {
                justify-content: flex-start;
                max-width: 350px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <section class="section-impact">
        <div class="container">
            
            <div class="impact-header">
                <h2>Measurable Impact. Better<br>Outcomes.</h2>
            </div>

            <div class="impact-grid">
                
                <div class="stat-item">
                    <div class="stat-icon"><i data-feather="clock"></i></div>
                    <div class="stat-content">
                        <h3>40%</h3>
                        <strong>Faster Response Time</strong>
                        <p>With One Click & Auto escalation</p>
                    </div>
                </div>

                <div class="stat-item">
                    <div class="stat-icon"><i data-feather="message-square"></i></div>
                    <div class="stat-content">
                        <h3>99%</h3>
                        <strong>Alert Delivered</strong>
                        <p>Reliable multi-channel delivery</p>
                    </div>
                </div>

                <div class="stat-item">
                    <div class="stat-icon"><i data-feather="bar-chart-2"></i></div>
                    <div class="stat-content">
                        <h3>70%</h3>
                        <strong>Reduction in Missed Alert</strong>
                        <p>Never miss a critical event</p>
                    </div>
                </div>

                <div class="stat-item">
                    <div class="stat-icon"><i data-feather="clipboard"></i></div>
                    <div class="stat-content">
                        <h3>100%</h3>
                        <strong>Compliance Ready</strong>
                        <p>Full compliance audit Reporting</p>
                    </div>
                </div>

            </div>

        </div>
    </section>

    <script>
        feather.replace();
    </script>

</body>
</html>
